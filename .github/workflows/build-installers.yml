
name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Validate the source before building installers
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  # Build macOS installer
  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.1 or newer
        shell: bash
        run: |
          set -euo pipefail
          selected=$(python3 -c 'import glob,re; p=glob.glob("/Applications/Xcode_26*.app"); print(max(p,key=lambda s:tuple(map(int,re.findall(r"[0-9]+",s)))) if p else "")')
          test -n "$selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version

      - name: Build macOS installer
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bash scripts/build-macos.sh "$BUILD_SHA"

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: installer/azooKey-wooden-structure-${{ github.sha }}.pkg
          if-no-files-found: error
          retention-days: 14

  # Build Windows installer
  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Enable long paths before checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enable Git long paths'
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: r
          sparse-checkout: |
            windows
            scripts
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.0.2-release
          swift-build: 6.0.2-RELEASE

      - uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Rust and Inno Setup
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw 'rustup failed'
          }

          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup installation failed'
          }

      - name: Build Windows IME installer
        shell: pwsh
        working-directory: r
        env:
          BUILD_SHA: ${{ github.sha }}
        run: ./scripts/build-windows.ps1 -Commit $env:BUILD_SHA

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: r/installer/azooKey-wooden-structure-${{ github.sha }}.exe
          if-no-files-found: error
          retention-days: 14

  # Publish GitHub beta pre-release
  publish:
    name: Publish Beta Release
    needs: [macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installer
          merge-multiple: true

      - name: Verify installers and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          pkg="azooKey-wooden-structure-${BUILD_SHA}.pkg"
          exe="azooKey-wooden-structure-${BUILD_SHA}.exe"

          test -s "installer/$pkg"
          test -s "installer/$exe"

          cd installer
          sha256sum "$pkg" "$exe" > SHA256SUMS.txt

          echo "SHA-256 checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Beta Pre-release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${BUILD_SHA:0:12}"
          TAG="beta-${BUILD_SHA}"
          TITLE="Beta (${SHORT_SHA})"

          PKG="installer/azooKey-wooden-structure-${BUILD_SHA}.pkg"
          EXE="installer/azooKey-wooden-structure-${BUILD_SHA}.exe"
          CHECKSUM="installer/SHA256SUMS.txt"

          cat > release-notes.md <<EOF
          ## Beta Build

          This is an automatically generated beta build of
          azooKey-wooden-structure.

          ### Build information

          - **Channel:** Beta (Pre-release)
          - **Branch:** main
          - **Commit:** [${SHORT_SHA}](https://github.com/${GH_REPO}/commit/${BUILD_SHA})
          - **Full commit SHA:** ${BUILD_SHA}

          ### Downloads

          - **macOS:** PKG installer
          - **Windows:** EXE installer
          - **SHA256SUMS.txt:** SHA-256 checksums

          ### Notes

          This is a development build and may be unstable.
          Both installers were built from the same source commit.

          ---
          Generated automatically by GitHub Actions.
          EOF

          # Reuse the release if this commit was already published.
          if gh release view "$TAG" \
            --repo "$GH_REPO" >/dev/null 2>&1; then

            echo "Existing beta release found: $TAG"

            EXISTING_ASSETS=$(gh release view "$TAG" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name')

            for FILE in "$PKG" "$EXE" "$CHECKSUM"; do
              NAME=$(basename "$FILE")

              if grep -Fxq "$NAME" <<< "$EXISTING_ASSETS"; then
                echo "Already uploaded: $NAME"
              else
                echo "Uploading missing asset: $NAME"
                gh release upload "$TAG" "$FILE" \
                  --repo "$GH_REPO"
              fi
            done

            # Recover a draft left by an interrupted upload.
            IS_DRAFT=$(gh release view "$TAG" \
              --repo "$GH_REPO" \
              --json isDraft \
              --jq '.isDraft')

            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$TAG" \
                --repo "$GH_REPO" \
                --draft=false \
                --prerelease
            fi

          else
            echo "Creating beta release: $TITLE"

            gh release create "$TAG" \
              "$PKG" \
              "$EXE" \
              "$CHECKSUM" \
              --repo "$GH_REPO" \
              --target "$BUILD_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi

          RELEASE_URL=$(gh release view "$TAG" \
            --repo "$GH_REPO" \
            --json url \
            --jq '.url')

          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Beta Release Published"
            echo ""
            echo "**Release:** $TITLE"
            echo ""
            echo "**Commit:** $BUILD_SHA"
            echo ""
            echo "**URL:** $RELEASE_URL"
            echo ""
            echo "### Assets"
            echo "- macOS PKG"
            echo "- Windows EXE"
            echo "- SHA-256 checksums"
          } >> "$GITHUB_STEP_SUMMARY"
